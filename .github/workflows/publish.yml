name: publish

# Staged npm publishing via OIDC trusted publishing.
#
# A `v*` tag push — or a manual dispatch naming an existing tag — verifies the
# tag, installs, typechecks, tests, builds, and then STAGES every workspace
# package to npm. Staging is private: nothing becomes installable until a
# maintainer approves every staged version with a 2FA prompt from their own
# machine:
#
#   node scripts/promote-release.mjs --version <version>
#
# That human approval step also creates the GitHub Release. This workflow
# therefore never publishes directly and never creates a GitHub Release: both
# need proof-of-presence, which only a maintainer with 2FA can provide.
#
# Keeping staging in CI and approval local is what makes a partial failure safe:
# an interrupted staging run leaves private staged uploads (rejectable and
# re-stageable) instead of a half-published version that consumers can install.
#
# There is NO npm token secret. GitHub Actions mints a short-lived OIDC token
# (`id-token: write`); pnpm exchanges it with the npm registry for a short-lived
# stage-publish token. The registry accepts the upload because each package has
# this exact workflow configured as a trusted publisher with stage-only
# permission:
#
#   npm trust github <package> \
#     --file publish.yml \
#     --repo yankeguo/dsh-infini-goal \
#     --allow-stage-publish --yes
#
# One-time setup and the migration away from the old `--allow-publish`
# configuration are documented in docs/PUBLISHING.md;
# scripts/trusted-publishers.sh configures, migrates, or verifies (`--list`) all
# packages in one go.
#
# Staging uses `pnpm stage publish` (scripts/stage-release.mjs), not
# `npm stage publish`: npm packs package.json verbatim, so the bundle's
# `workspace:*` dependency specs would ship unresolved, while pnpm rewrites them
# to the exact released versions.
#
# Requirements enforced by npm for trusted publishing:
#   - package already exists on the registry (the very first version of a new
#     package is published once by a maintainer with 2FA),
#   - this workflow file lives at .github/workflows/publish.yml,
#   - runner is GitHub-hosted (self-hosted runners are not supported),
#   - repository/workflow/environment claims match the trust configuration.
# Provenance is attached automatically: the package is public and this
# repository is public.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing v* tag to (re-)stage, e.g. v0.2.0. The tag is never moved.'
        required: true
        type: string
      dry_run:
        description: 'Run the staging plan with pnpm --dry-run (no upload)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  # Required for OIDC: lets pnpm request a GitHub Actions ID token and exchange
  # it with the npm registry for a short-lived stage-publish token.
  id-token: write

concurrency:
  group: publish-${{ github.event.inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the release tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ github.event.inputs.release_tag }}
          PUSH_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="${DISPATCH_TAG}"
          else
            tag="${PUSH_TAG}"
          fi
          case "${tag}" in
            v[0-9]*) ;;
            *) echo "release tag must look like v<version> (got '${tag}')" >&2; exit 1 ;;
          esac
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          printf '### Staged publish: `%s`\n\n' "${tag}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          # A manual dispatch re-runs an EXISTING tag without moving it, so the
          # staged contents always match the released commit. A code fix needs a
          # new version (and tag); never rewrite history for a release.
          ref: ${{ steps.release.outputs.tag }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          version: 12.16.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # Never cache in release builds: build inputs must be reproducible.
          package-manager-cache: false

      - name: Verify the tag matches every package version
        # `--gate` checks the tag/version consistency and the dependency staging
        # order before anything is installed; the staging step re-validates the
        # build artifacts before the first upload.
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: node scripts/stage-release.mjs --release-tag "${RELEASE_TAG}" --gate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify the generated bundle patches are up to date
        run: node scripts/build-disable-goal-bundle.mjs --check

      - name: Stage packages (OIDC trusted publishing)
        # No NODE_AUTH_TOKEN and no NPM_TOKEN: pnpm detects the GitHub Actions
        # OIDC environment, exchanges its ID token for a registry token, and
        # uploads private staged versions. Staging never prompts for 2FA; the
        # approval step (scripts/promote-release.mjs) does, outside CI.
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          set -euo pipefail
          args=(--release-tag "${RELEASE_TAG}" --provenance --no-git-checks)
          if [ "${DRY_RUN}" = "true" ]; then
            args+=(--dry-run)
          fi
          node scripts/stage-release.mjs "${args[@]}"
