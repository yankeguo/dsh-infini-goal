name: publish

# Publish the whole plugin suite to npm and cut a GitHub Release when a `v*` tag
# is pushed. Manual equivalent: `pnpm release:publish` after `npm login`.
#
# Required repository secret:
#   NPM_TOKEN — an npm automation/granular access token with publish rights on
#               the @yankeguo scope (Granular token: read+write on
#               @yankeguo/dsh-infini-goal* and @yankeguo/dsh-tool-* /
#               @yankeguo/dsh-command-* / @yankeguo/dsh-client-ui-*).
#
# Release notes come from docs/releases/<tag>.md; create that file before
# pushing the tag.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Publish packages
        run: pnpm publish -r --access public --no-git-checks --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file "$notes"
          else
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
