# Main bundle rows for the infini-goal suite. Applied first; the generated
# ./cordis.disable-goal.patch.yml is applied right after it (see
# dsh.bundle.patch in package.json) and switches the built-in dsh-goal mode off
# by default. Delete a row here only together with the package it names.
- insert:
    - id: infini-goal
      name: '@yankeguo/dsh-infini-goal'
      config:
        defaultMinIntervalMs: 60000
        defaultQuietWindows: []
    - id: infini-goal-driver
      name: '@yankeguo/dsh-infini-goal-driver'
    - id: infini-goal-tool
      name: '@yankeguo/dsh-tool-infini-goal'
    - id: infini-goal-command
      name: '@yankeguo/dsh-command-infini-goal'
    - id: infini-goal-ui
      name: '@yankeguo/dsh-client-ui-infini-goal'
